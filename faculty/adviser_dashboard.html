<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Adviser Dashboard - OJT Monitoring</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --brand-primary: #1e3a8a;
            /* Deep Navy */
            --brand-secondary: #0d9488;
            /* Modern Teal */
            --brand-dark: #0f172a;
            /* Slate Dark */
            --brand-accent: #f59e0b;
            /* Warm Amber */
        }

        body {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.88), rgba(30, 58, 138, 0.85)),
                url('assets/images/west-prime.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .wrapper {
            display: flex;
        }

        #sidebar {
            min-width: 260px;
            max-width: 260px;
            background: var(--brand-dark);
            color: #fff;
            height: 100vh;
            position: fixed;
            transition: all 0.3s;
        }

        #sidebar .sidebar-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.03);
        }

        #sidebar .sidebar-header h3 {
            margin: 0;
            font-weight: 700;
        }

        #sidebar ul.components {
            padding: 1rem;
            list-style: none;
        }

        #sidebar ul li a {
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            border-radius: 0.5rem;
            transition: all 0.25s;
        }

        #sidebar ul li a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transform: translateX(4px);
        }

        #sidebar ul li.active a {
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent));
            color: #fff;
            font-weight: 600;
        }

        #content {
            margin-left: 260px;
            padding: 2rem;
            width: 100%;
        }

        .card-stat {
            background: #fff;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3><i class="bi bi-building me-2"></i>WPH Institute</h3>
                <p><i class="bi bi-geo-alt-fill me-1"></i>Barangay San Francisco</p>
            </div>
            <ul class="components">
                <li class="active"><a href="faculty/adviser_dashboard.html"><i
                            class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <!-- <li><a href="../establishment/attendance_approval.html"><i
                            class="bi bi-calendar-check me-2"></i>Attendance Approvals</a></li>
                <li><a href="../students/student_dashboard.html"><i class="bi bi-people-fill me-2"></i>Student
                        Details</a></li>
                <li><a href="../admin/dashboard.html"><i class="bi bi-gear me-2"></i>Admin Panel</a></li> -->
                <li><a href="../index.html"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
            </ul>
        </nav>
        <!-- Page Content -->
        <div id="content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0"><i class="bi bi-journal-bookmark-fill me-2"></i>Faculty Adviser Dashboard</h2>
                <div id="currentDateTime"></div>
            </div>
            <div class="row">
                <div class="col-lg-12 mb-4">
                    <div class="card-stat">
                        <h5 class="mb-3">Student Progress by Establishment</h5>
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>Establishment</th>
                                    <th>Total Students</th>
                                    <th>Average Attendance %</th>
                                    <th>Average Hours Completed</th>
                                </tr>
                            </thead>
                            <tbody id="establishmentTableBody">
                                <!-- Data injected by script -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sample data – in a real app this would be fetched from a backend
        const establishments = [
            { name: 'Nexus Cloud Technologies', students: 34, attendance: 92, hoursAvg: 380 },
            { name: 'CyberShield Systems Inc.', students: 26, attendance: 88, hoursAvg: 420 },
            { name: 'Summit Financial Group', students: 19, attendance: 85, hoursAvg: 350 },
            { name: 'AeroTech Engineering Works', students: 16, attendance: 90, hoursAvg: 370 },
            { name: 'SyCip & Associates CPAs', students: 14, attendance: 87, hoursAvg: 360 },
            { name: 'Grand Regency Hotel & Resort', students: 12, attendance: 80, hoursAvg: 300 }
        ];
        function loadTable() {
            const tbody = document.getElementById('establishmentTableBody');
            let rows = '';
            establishments.forEach(est => {
                rows += `<tr>
                    <td>${est.name}</td>
                    <td>${est.students}</td>
                    <td>${est.attendance}%</td>
                    <td>${est.hoursAvg} hrs</td>
                </tr>`;
            });
            tbody.innerHTML = rows;
        }
        function updateDateTime() {
            const now = new Date();
            const opts = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('currentDateTime').textContent = now.toLocaleDateString(undefined, opts) + ' ' + now.toLocaleTimeString();
        }
        document.addEventListener('DOMContentLoaded', () => {
            loadTable();
            updateDateTime();
            setInterval(updateDateTime, 1000);
        });
    </script>
</body>

</html>
