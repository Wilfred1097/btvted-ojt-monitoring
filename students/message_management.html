<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Management - OJT Monitoring System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Emoji Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.14.0/css/emoji-picker.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('../assets/images/west-prime.jpg') no-repeat center center fixed;
            background-size: cover;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        #sidebar {
            min-width: 280px;
            max-width: 280px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            transition: all 0.3s ease-in-out;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 1000;
            box-shadow: 3px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
        }
        
        #sidebar.active {
            left: -280px;
        }
        
        #sidebar .sidebar-header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        #sidebar .sidebar-header h3 {
            margin-bottom: 5px;
            font-weight: 700;
            font-size: 1.5rem;
        }
        
        #sidebar .sidebar-header p {
            margin-bottom: 0;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        #sidebar ul.components {
            padding: 20px 0;
            list-style: none;
            margin-bottom: 80px;
        }
        
        #sidebar ul li {
            padding: 0 15px;
            margin-bottom: 5px;
        }
        
        #sidebar ul li a {
            padding: 12px 15px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        #sidebar ul li a i {
            margin-right: 12px;
            font-size: 1.3rem;
            width: 25px;
            text-align: center;
        }
        
        #sidebar ul li a:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
            transform: translateX(5px);
        }
        
        #sidebar ul li.active a {
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        #sidebar .user-info {
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,255,255,0.1);
            position: absolute;
            bottom: 0;
            width: 100%;
        }
        
        #sidebar .user-info .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        /* Main Content Styles */
        #content {
            width: 100%;
            margin-left: 280px;
            padding: 20px;
            min-height: 100vh;
            transition: all 0.3s ease-in-out;
        }

        #content.active {
            margin-left: 0;
        }

        /* Sidebar Toggle Button */
        #sidebarCollapse {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #fff;
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.3s;
            z-index: 1001;
        }

        #sidebarCollapse:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        /* Message Dashboard Styles */
        .message-dashboard {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            min-height: calc(100vh - 120px);
            display: flex;
        }

        /* Contacts Sidebar */
        .contacts-sidebar {
            width: 400px;
            background: #f8f9fa;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
        }

        .contacts-header {
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
            background: white;
        }

        .contacts-search {
            padding: 15px 20px;
            border-bottom: 1px solid #e9ecef;
        }

        .contacts-search input {
            border: 1px solid #e9ecef;
            border-radius: 50px;
            padding: 10px 15px;
            width: 100%;
            transition: all 0.3s;
        }

        .contacts-search input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .contact-item:hover {
            background: #e9ecef;
        }

        .contact-item.active {
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            border-left: 4px solid #667eea;
        }

        .contact-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-right: 15px;
            position: relative;
        }

        .contact-avatar.small {
            width: 40px;
            height: 40px;
            font-size: 1rem;
        }

        .contact-avatar .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid white;
        }

        .status-dot.online {
            background: #28a745;
        }

        .status-dot.offline {
            background: #6c757d;
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            font-weight: 600;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }

        .contact-lastmsg {
            font-size: 0.85rem;
            color: #6c757d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .contact-time {
            font-size: 0.7rem;
            color: #6c757d;
        }

        .badge-unread {
            background: #667eea;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .contact-type-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
        }

        .type-student {
            background: #d4edda;
            color: #155724;
        }

        .type-establishment {
            background: #cce5ff;
            color: #004085;
        }

        .evaluation-header {
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            background: white;
        }

        .chat-header-info {
            flex: 1;
        }

        .chat-header-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .chat-header-status {
            font-size: 0.85rem;
            color: #28a745;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
        }

        .message-date-divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .message-date-divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e9ecef;
            z-index: 1;
        }

        .message-date-divider span {
            background: #f8f9fa;
            padding: 0 15px;
            color: #6c757d;
            font-size: 0.85rem;
            position: relative;
            z-index: 2;
        }

        .message-wrapper {
            display: flex;
            margin-bottom: 20px;
        }

        .message-wrapper.sent {
            justify-content: flex-end;
        }

        .message-wrapper.received {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 18px;
            border-radius: 20px;
            position: relative;
            word-wrap: break-word;
        }

        .message-wrapper.sent .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message-wrapper.received .message-bubble {
            background: white;
            color: #495057;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 5px;
        }

        .message-time {
            font-size: 0.7rem;
            margin-top: 5px;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .message-wrapper.sent .message-time {
            justify-content: flex-end;
        }

        .message-status {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .message-status i.read {
            color: #28a745;
        }

        .message-status i.delivered {
            color: #6c757d;
        }

        /* Chat Input */
        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #e9ecef;
            background: white;
        }

        .chat-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9fa;
            border-radius: 50px;
            padding: 5px 5px 5px 20px;
            border: 1px solid #e9ecef;
        }

        .chat-input-wrapper:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .chat-input-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 0;
        }

        .chat-input-wrapper input:focus {
            outline: none;
        }

        .chat-actions {
            display: flex;
            gap: 5px;
            padding-right: 5px;
        }

        .chat-action-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .chat-action-btn:hover {
            background: #e9ecef;
            transform: scale(1.1);
        }

        .chat-action-btn.send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .chat-action-btn.send:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .recipient-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .recipient-item:hover {
            background: #f8f9fa;
            border-color: #e9ecef;
        }

        .recipient-item.selected {
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            border-color: #667eea;
        }

        .recipient-radio {
            margin-right: 15px;
        }

        /* Quick Responses */
        .quick-responses {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .quick-response-btn {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.9rem;
            color: #495057;
            transition: all 0.3s;
        }

        .quick-response-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* Overlay for mobile */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .overlay.active {
            opacity: 1;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            #sidebar {
                left: -280px;
            }
            
            #sidebar.active {
                left: 0;
            }
            
            #content {
                margin-left: 0 !important;
            }
            
            .message-dashboard {
                flex-direction: column;
            }
            
            .contacts-sidebar {
                width: 100%;
                max-height: 300px;
            }
            
            .message-bubble {
                max-width: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Overlay for mobile -->
        <div class="overlay" onclick="toggleSidebar()"></div>
        
        <!-- Left Sidebar Navigation -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3><i class="bi bi-building me-2"></i>WPH Institute</h3>
                <p><i class="bi bi-geo-alt-fill me-1"></i>Barangay San Francisco</p>
            </div>

            <ul class="components">
                <li>
                    <a href="student_dashboard.html#dashboard" onclick="return navigateToStudentDashboard('dashboard')">
                        <i class="bi bi-speedometer2"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="student_dashboard.html#attendance" onclick="return navigateToStudentDashboard('attendance')">
                        <i class="bi bi-calendar-check"></i>
                        <span>Attendance</span>

                </li>
                <li>
                    <a href="student_dashboard.html#documents" onclick="return navigateToStudentDashboard('documents')">

                    </a>
                </li>
                <li>
                    <a href="student_dashboard.html#credentials" onclick="return navigateToStudentDashboard('credentials')">

                        <span>Credentials</span>
                    </a>
                </li>
                <li>
                    <a href="student_dashboard.html#profile" onclick="return navigateToStudentDashboard('profile')">
                        <i class="bi bi-person-circle"></i>
                        <span>Profile</span>
                    </a>
                </li>
                <li class="active">
                    <a href="message_management.html">
                        <i class="bi bi-chat-dots-fill"></i>
                        <span>Messages</span>
                    </a>
                </li>
            </ul>

            <div class="user-info">
                <div class="d-flex align-items-center">
                    <div class="user-avatar me-3">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <div>
                        <div class="fw-semibold">Juan Dela Cruz</div>
                        <small class="text-white"><i class="bi bi-envelope me-1"></i>juan.dc@wphi.edu</small>
                    </div>
                    <a href="../index.html" class="ms-auto text-light" title="Logout">
                        <i class="bi bi-box-arrow-right fs-5"></i>
                    </a>
                </div>
            </div>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <!-- Top Navigation -->
            <div class="d-flex align-items-center mb-4">
                <button type="button" id="sidebarCollapse" class="btn" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
            </div>

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4 text-white">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h2 class="mb-2"><i class="bi bi-chat-dots-fill"></i> Messages</h2>
                        <p class="mb-0">Chat with students and Supervisors</p>
                    </div>
                </div>
            </div>

            <!-- Message Dashboard -->
            <div class="message-dashboard">
                <!-- Contacts Sidebar -->
                <div class="contacts-sidebar">
                    <div class="contacts-header">
                        <h5 class="mb-0"><i class="bi bi-chat-dots-fill me-2 text-primary"></i>Messages</h5>
                    </div>
                    
                    <div class="contacts-search">
                        <input type="text" id="contactSearch" placeholder="Search contacts..." onkeyup="searchContacts()">
                    </div>
                    
                    <div class="contacts-list" id="contactsList">
                        <!-- Contacts will be loaded here -->
                    </div>
                </div>

                <!-- Chat Area -->
                <div class="chat-area">
                    <div class="chat-header" id="chatHeader">
                        <div class="chat-header-info">
                            <div class="chat-header-name" id="currentChatName">Select a conversation</div>
                        </div><!-- 
                        <div>
                            <button class="btn btn-sm btn-outline-primary me-2" onclick="viewContactInfo()">
                                <i class="bi bi-info-circle"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteConversation()">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div> -->
                    </div>

                    <div class="chat-messages" id="chatMessages">
                        <!-- Messages will be loaded here -->
                        <!-- <div class="message-date-divider">
                            <span>Today</span>
                        </div> -->
                    </div>

                    <div class="chat-input-area" id="chatInputArea">
                        <!-- Quick Responses -->
                        <div class="quick-responses mb-3" id="quickResponses">
                            <button class="quick-response-btn" onclick="addQuickResponse('Thank you for your message.')">Thank you</button>
                            <button class="quick-response-btn" onclick="addQuickResponse('Please submit your requirements.')">Submit requirements</button>
                            <button class="quick-response-btn" onclick="addQuickResponse('Your attendance has been approved.')">Attendance approved</button>
                            <button class="quick-response-btn" onclick="addQuickResponse('Please check your documents.')">Check documents</button>
                        </div>

                        <div class="chat-input-wrapper">
                            <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
                            <div class="chat-actions">
                                <!-- <button class="chat-action-btn" onclick="toggleEmojiPicker()">
                                    <i class="bi bi-emoji-smile"></i>
                                </button>
                                <button class="chat-action-btn" onclick="attachFile()">
                                    <i class="bi bi-paperclip"></i>
                                </button> -->
                                <button class="chat-action-btn send" onclick="sendMessage()">
                                    <i class="bi bi-send"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Contact Info Modal -->
    <div class="modal fade" id="contactInfoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title"><i class="bi bi-person-circle me-2"></i>Contact Information</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="contactInfoBody">
                    <!-- Contact info will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <script>
        // Sample data for contacts
        const contacts = [
            {
                id: 'STU-001',
                name: 'Juan Dela Cruz',
                type: 'student',
                avatar: 'JD',
                lastMessage: 'Thank you for the information',
                lastMessageTime: '10:30 AM',
                unread: 2,
                online: true,
                email: 'juan.dc@wphi.edu',
                phone: '09171234567',
                establishment: 'Tech Solutions Inc.',
                position: 'OJT Student'
            },
            {
                id: 'EST-001',
                name: 'Tech Solutions Inc.',
                type: 'establishment',
                avatar: 'TS',
                lastMessage: 'Meeting scheduled for tomorrow',
                lastMessageTime: '9:15 AM',
                unread: 1,
                online: true,
                email: 'hr@techsolutions.com',
                phone: '0288888888',
                contact: 'John Smith',
                position: 'HR Manager'
            }
        ];

        // Sample messages for each conversation
        const conversations = {
            'STU-001': [
                { type: 'received', message: 'Good morning! I have a question about my attendance.', time: '9:00 AM', date: '2024-03-15', status: 'read' },
                { type: 'sent', message: 'Good morning! What would you like to know?', time: '9:15 AM', date: '2024-03-15', status: 'read' },
                { type: 'received', message: 'I need to adjust my time-in for tomorrow. Is that possible?', time: '9:30 AM', date: '2024-03-15', status: 'read' },
                { type: 'sent', message: 'Yes, you can submit a request through the attendance page. I\'ll approve it once submitted.', time: '9:45 AM', date: '2024-03-15', status: 'read' },
                { type: 'received', message: 'Thank you for the information!', time: '10:30 AM', date: '2024-03-15', status: 'read' }
            ],
            'EST-001': [
                { type: 'received', message: 'Hello Admin, we need to discuss the upcoming OJT orientation.', time: '8:30 AM', date: '2024-03-15', status: 'read' },
                { type: 'sent', message: 'Sure, what time works best for you?', time: '8:45 AM', date: '2024-03-15', status: 'read' },
                { type: 'received', message: 'How about 2 PM tomorrow?', time: '9:00 AM', date: '2024-03-15', status: 'read' },
                { type: 'sent', message: 'That works for me. I\'ll send a calendar invite.', time: '9:15 AM', date: '2024-03-15', status: 'read' }
            ]
        };

        let currentContactId = null;

        // Load contacts list
        function loadContacts() {
            const contactsList = document.getElementById('contactsList');
            let html = '';

            contacts.forEach(contact => {
                const unreadBadge = contact.unread > 0 ? `<span class="badge-unread">${contact.unread}</span>` : '';
                const typeBadge = contact.type === 'student' ? 
                    '<span class="contact-type-badge type-student">Student</span>' : 
                    '<span class="contact-type-badge type-establishment">Establishment</span>';

                html += `
                    <div class="contact-item ${currentContactId === contact.id ? 'active' : ''}" onclick="selectContact('${contact.id}')">
                        <div class="contact-avatar small">
                            ${contact.avatar}
                        </div>
                        <div class="contact-info">
                            <div class="contact-name">
                                <span>${contact.name}</span>
                                
                            </div>
                        </div>
                        <div class="text-end">
                            <div class="contact-time">${typeBadge}</div>
                        </div>
                    </div>
                `;
            });

            contactsList.innerHTML = html;
        }

        // Select contact and load conversation
        function selectContact(contactId) {
            currentContactId = contactId;
            const contact = contacts.find(c => c.id === contactId);
            
            // Update chat header
            document.getElementById('currentChatName').textContent = contact.name;

            // Load messages
            loadMessages(contactId);
            
            // Update active state in contacts list
            loadContacts();
            
            // Enable chat input
            document.getElementById('chatInputArea').style.opacity = '1';
            document.getElementById('messageInput').disabled = false;
            document.getElementById('messageInput').focus();
        }

        // Load messages for selected contact
        function loadMessages(contactId) {
            const messagesContainer = document.getElementById('chatMessages');
            const conversation = conversations[contactId] || [];
            
            if (conversation.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-chat-dots display-1"></i>
                        <p class="mt-3">No messages yet. Start a conversation!</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="message-date-divider"><span></span></div>';
            
            conversation.forEach(msg => {
                const timeStatus = msg.type === 'sent' ? `
                    <span class="message-status">
                        <i class="bi bi-check2-all ${msg.status === 'read' ? 'read' : 'delivered'}"></i>
                    </span>
                ` : '';

                html += `
                    <div class="message-wrapper ${msg.type}">
                        <div class="message-bubble">
                            ${msg.message}
                            <div class="message-time">
                                <span>${msg.time}</span>
                                ${timeStatus}
                            </div>
                        </div>
                    </div>
                `;
            });

            messagesContainer.innerHTML = html;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Send message
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !currentContactId) return;

            // Add message to conversation
            if (!conversations[currentContactId]) {
                conversations[currentContactId] = [];
            }

            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            conversations[currentContactId].push({
                type: 'sent',
                message: message,
                time: timeStr,
                date: now.toISOString().split('T')[0],
                status: 'delivered'
            });

            // Update last message in contacts
            const contact = contacts.find(c => c.id === currentContactId);
            contact.lastMessage = message;
            contact.lastMessageTime = 'Just now';

            // Reload messages and contacts
            loadMessages(currentContactId);
            loadContacts();

            // Clear input
            input.value = '';

            // Simulate reply after 2 seconds (for demo)
            setTimeout(() => {
                simulateReply(currentContactId);
            }, 2000);
        }

        // Simulate reply (for demo purposes)
        function simulateReply(contactId) {
            if (!conversations[contactId]) return;

            const replies = [
                "Thanks for the message!",
                "I'll check on that.",
                "Got it, thanks!",
                "Can you provide more details?",
                "I'll get back to you soon."
            ];

            const randomReply = replies[Math.floor(Math.random() * replies.length)];
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            conversations[contactId].push({
                type: 'received',
                message: randomReply,
                time: timeStr,
                date: now.toISOString().split('T')[0]
            });

            // Update unread count
            const contact = contacts.find(c => c.id === contactId);
            contact.unread = (contact.unread || 0) + 1;

            loadMessages(contactId);
            loadContacts();
        }

        // Handle Enter key press
        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // Search contacts
        function searchContacts() {
            const searchTerm = document.getElementById('contactSearch').value.toLowerCase();
            const contactItems = document.querySelectorAll('.contact-item');

            contactItems.forEach(item => {
                const name = item.querySelector('.contact-name span').textContent.toLowerCase();
                if (name.includes(searchTerm)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Filter recipients
        function filterRecipients(type) {
            loadRecipients(type);
        }

        // Search recipients
        function searchRecipients() {
            const searchTerm = document.getElementById('recipientSearch').value.toLowerCase();
            const recipientItems = document.querySelectorAll('.recipient-item');

            recipientItems.forEach(item => {
                const name = item.querySelector('.fw-semibold').textContent.toLowerCase();
                if (name.includes(searchTerm)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Select recipient
        function selectRecipient(contactId) {
            const radio = document.querySelector(`input[value="${contactId}"]`);
            if (radio) {
                radio.checked = true;
            }
        }

        // Add quick response
        function addQuickResponse(response) {
            document.getElementById('messageInput').value = response;
            document.getElementById('messageInput').focus();
        }

        // Toggle emoji picker (placeholder)
        function toggleEmojiPicker() {
            alert('Emoji picker would open here');
        }

        // Attach file
        function attachFile() {
            alert('File attachment dialog would open here');
        }

        function navigateToStudentDashboard(section) {
            // Store the section to show in session storage
            sessionStorage.setItem('studentDashboardSection', section);
            // Navigate to student dashboard
            window.location.href = 'student_dashboard.html';
            return false; // Prevent default anchor behavior
        }

        // View contact info
        function viewContactInfo() {
            if (!currentContactId) return;

            const contact = contacts.find(c => c.id === currentContactId);
            const modalBody = document.getElementById('contactInfoBody');

            if (contact.type === 'student') {
                modalBody.innerHTML = `
                    <div class="text-center mb-4">
                        <div class="contact-avatar mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem;">
                            ${contact.avatar}
                        </div>
                        <h5>${contact.name}</h5>
                        <p class="text-muted">${contact.position}</p>
                    </div>
                    <table class="table">
                        <tr>
                            <th>Email:</th>
                            <td>${contact.email}</td>
                        </tr>
                        <tr>
                            <th>Phone:</th>
                            <td>${contact.phone}</td>
                        </tr>
                        <tr>
                            <th>Establishment:</th>
                            <td>${contact.establishment}</td>
                        </tr>
                    </table>
                `;
            } else {
                modalBody.innerHTML = `
                    <div class="text-center mb-4">
                        <div class="contact-avatar mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem;">
                            ${contact.avatar}
                        </div>
                        <h5>${contact.name}</h5>
                        <p class="text-muted">${contact.position}</p>
                    </div>
                    <table class="table">
                        <tr>
                            <th>Contact Person:</th>
                            <td>${contact.contact}</td>
                        </tr>
                        <tr>
                            <th>Email:</th>
                            <td>${contact.email}</td>
                        </tr>
                        <tr>
                            <th>Phone:</th>
                            <td>${contact.phone}</td>
                        </tr>
                    </table>
                `;
            }

            new bootstrap.Modal(document.getElementById('contactInfoModal')).show();
        }

        // Delete conversation
        function deleteConversation() {
            if (!currentContactId) return;
            
            if (confirm('Are you sure you want to delete this conversation?')) {
                delete conversations[currentContactId];
                currentContactId = null;
                document.getElementById('chatMessages').innerHTML = `
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-chat-dots display-1"></i>
                        <p class="mt-3">Select a conversation to start messaging</p>
                    </div>
                `;
                document.getElementById('currentChatName').textContent = 'Select a conversation';
                loadContacts();
            }
        }

        // Toggle sidebar
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('content').classList.toggle('active');
            document.querySelector('.overlay').classList.toggle('active');
        }

        // Handle window resize
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                document.getElementById('sidebar').classList.remove('active');
                document.getElementById('content').classList.remove('active');
                document.querySelector('.overlay').classList.remove('active');
            }
        });

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('sidebarCollapse');
            
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(event.target) && !toggleBtn.contains(event.target) && sidebar.classList.contains('active')) {
                    sidebar.classList.remove('active');
                    document.getElementById('content').classList.remove('active');
                    document.querySelector('.overlay').classList.remove('active');
                }
            }
        });

        // Initialize from session storage if coming from attendance page
        document.addEventListener('DOMContentLoaded', function() {
            loadContacts();
            
            // Check if there's a recipient from previous page
            const recipientId = sessionStorage.getItem('messageRecipientId');
            const recipientName = sessionStorage.getItem('messageRecipientName');
            
            if (recipientId) {
                selectContact(recipientId);
                
                // Clear session storage
                sessionStorage.removeItem('messageRecipientId');
                sessionStorage.removeItem('messageRecipientName');
                sessionStorage.removeItem('messageRecipientType');
            }
        });
    </script>
</body>
</html>
